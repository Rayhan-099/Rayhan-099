<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <filter id="sigilGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="sigilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B8CFF"/>
      <stop offset="50%" stop-color="#C9B8FF"/>
      <stop offset="100%" stop-color="#8D6AC8"/>
    </linearGradient>
    <style>
      @keyframes sigilPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
      @keyframes innerSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
      .sigil-body { animation: sigilPulse 4s ease-in-out infinite; }
      .inner-pattern { animation: innerSpin 30s linear infinite; transform-origin: 40px 40px; }
    </style>
  </defs>

  <g class="sigil-body" filter="url(#sigilGlow)">
    <!-- Outer octagonal frame -->
    <polygon points="40,5 58,14 67,32 67,48 58,66 40,75 22,66 13,48 13,32 22,14"
             fill="none" stroke="#5B3A91" stroke-width="1.5" opacity="0.5"/>

    <!-- Inner hexagon -->
    <polygon points="40,15 55,25 55,50 40,60 25,50 25,25"
             fill="none" stroke="#8D6AC8" stroke-width="1" opacity="0.4"/>

    <!-- Inner rotating geometric pattern -->
    <g class="inner-pattern">
      <!-- Triangle 1 -->
      <polygon points="40,20 52,45 28,45"
               fill="none" stroke="url(#sigilGrad)" stroke-width="1" opacity="0.5"/>
      <!-- Triangle 2 (inverted) -->
      <polygon points="40,55 28,30 52,30"
               fill="none" stroke="url(#sigilGrad)" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- Center vertical line -->
    <line x1="40" y1="18" x2="40" y2="62" stroke="#C9B8FF" stroke-width="0.5" opacity="0.3"/>
    <!-- Center horizontal line -->
    <line x1="18" y1="40" x2="62" y2="40" stroke="#C9B8FF" stroke-width="0.5" opacity="0.3"/>

    <!-- Center circle -->
    <circle cx="40" cy="40" r="6" fill="none" stroke="#C9B8FF" stroke-width="1" opacity="0.6"/>
    <circle cx="40" cy="40" r="3" fill="#9B8CFF" opacity="0.5"/>
    <circle cx="40" cy="40" r="1.5" fill="#E6E0F5" opacity="0.7"/>

    <!-- Corner ornamental dots -->
    <circle cx="40" cy="5" r="1.5" fill="#9B8CFF" opacity="0.5"/>
    <circle cx="40" cy="75" r="1.5" fill="#9B8CFF" opacity="0.5"/>
    <circle cx="13" cy="40" r="1.5" fill="#9B8CFF" opacity="0.5"/>
    <circle cx="67" cy="40" r="1.5" fill="#9B8CFF" opacity="0.5"/>
  </g>
</svg>
