<svg xmlns="http://www.w3.org/2000/svg" width="800" height="30" viewBox="0 0 800 30">
  <defs>
    <style>
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes typeIn { 0% { width: 0; } 100% { width: 180px; } }
      .cursor { animation: blink 1s step-end infinite; }
      .term-text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 11px; fill: #9B8CFF; }
      .term-dim { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 11px; fill: #5B3A91; }
      .prompt { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 11px; fill: #8D6AC8; }
      @keyframes fadeLoop { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }
      .dots { animation: fadeLoop 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Left decorative dashes -->
  <text x="100" y="18" class="term-dim">──────</text>

  <!-- Terminal prompt -->
  <text x="170" y="18" class="prompt">❯</text>
  <text x="185" y="18" class="term-text">rayhan@teyvat</text>
  <text x="300" y="18" class="term-dim">~</text>
  <text x="312" y="18" class="term-text">✦</text>

  <!-- Loading dots -->
  <text x="340" y="18" class="term-dim dots">···</text>

  <!-- Blinking cursor -->
  <rect class="cursor" x="370" y="8" width="8" height="14" fill="#C9B8FF" opacity="0.7" rx="1"/>

  <!-- Right decorative dashes -->
  <text x="400" y="18" class="term-dim">──────</text>

  <!-- Secondary prompt echo -->
  <text x="470" y="18" class="prompt" opacity="0.4">❯</text>
  <text x="485" y="18" class="term-dim" opacity="0.3">loading profile</text>
  <text x="610" y="18" class="term-dim dots" style="animation-delay: 1s">···</text>

  <!-- Right dashes -->
  <text x="650" y="18" class="term-dim">──────</text>
</svg>
